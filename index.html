<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A minimal static Hello World website hosted on GitHub Pages." />
  <meta name="color-scheme" content="light dark" />
  <title>Hello World</title>

  <!-- Relative paths only: the site may live under https://<user>.github.io/<repo>/ -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <script>
    // Runs before first paint: applies the stored theme so the page never
    // flashes the wrong colours. No stored choice means "follow the OS".
    (function () {
      try {
        var t = localStorage.getItem("hello-world:theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* Storage blocked: the OS preference is used instead. */
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <span class="brand">hello-world</span>
    <!-- aria-pressed reflects the "dark mode is on" state for screen readers -->
    <button id="theme-toggle" class="icon-button" type="button"
            aria-pressed="false" aria-label="Toggle dark mode">
      <span class="icon-sun" aria-hidden="true">☀</span>
      <span class="icon-moon" aria-hidden="true">☾</span>
    </button>
  </header>

  <main class="hero">
    <p class="eyebrow">A static site on GitHub Pages</p>

    <!-- The greeting text is replaced by JS; the markup keeps a readable default
         so the page still makes sense when JavaScript is disabled.
         aria-live announces each new greeting without stealing focus from the
         button that triggered it. -->
    <div aria-live="polite">
      <h1 id="greeting" class="greeting">Hello, World!</h1>
      <p id="greeting-lang" class="greeting-lang">English</p>
    </div>

    <div class="actions">
      <button id="next-greeting" class="button button-primary" type="button">
        Say it in another language
      </button>
      <a class="button button-ghost"
         href="https://docs.github.com/en/pages"
         target="_blank" rel="noopener noreferrer">GitHub Pages docs</a>
    </div>

    <!-- aria-live: announce the counter update without moving focus -->
    <p class="counter">
      Greetings shown: <output id="counter" aria-live="polite">1</output>
    </p>
  </main>

  <footer class="footer">
    <p>
      Built with plain HTML, CSS and JavaScript &mdash; no build step, no backend.
    </p>
    <p class="footer-meta">
      <span id="build-time">Loading&hellip;</span>
    </p>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
